<div class="container-fluid py-4">
    <div class="row mb-4 align-items-center">
        <div class="col">
            <h2 class="mb-0 fw-bold">Agencies & Offices</h2>
            <p class="text-muted mb-0">Manage registered law enforcement agencies and forensic labs</p>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <app-aziende-tabella *ngIf="isInitialized" [agencies]="agencies"></app-aziende-tabella>
            
            <div *ngIf="!isInitialized" class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>
    </div>
</div>
