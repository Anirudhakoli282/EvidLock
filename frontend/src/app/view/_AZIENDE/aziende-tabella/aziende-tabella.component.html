<div class="card border-0 shadow-sm rounded-3">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table align-middle mb-0 bg-white" mat-table [dataSource]="dataSource" matSort>

                <ng-container matColumnDef="logo">
                    <th mat-header-cell *matHeaderCellDef> Logo </th>
                    <td mat-cell *matCellDef="let row">
                        <img *ngIf="row.logo" [src]="row.logo" alt="{{row.name}}" style="width: 45px; height: 45px; object-fit: contain;" class="rounded bg-light p-1" />
                        <div *ngIf="!row.logo" class="bg-light rounded d-flex align-items-center justify-content-center text-muted" style="width: 45px; height: 45px;">
                            <i class="bi bi-building"></i>
                        </div>
                    </td>
                </ng-container>

                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Agency Name </th>
                    <td mat-cell *matCellDef="let row">
                        <p class="fw-bold mb-1">{{row.name || row.ragioneSociale}}</p>
                        <p class="text-muted mb-0 small">{{row.email}}</p>
                    </td>
                </ng-container>

                <ng-container matColumnDef="agencyCode">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Agency Code </th>
                    <td mat-cell *matCellDef="let row">
                        <span class="badge bg-secondary font-monospace">{{row.agencyCode || row.piva}}</span>
                    </td>
                </ng-container>

                <ng-container matColumnDef="address">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Address </th>
                    <td mat-cell *matCellDef="let row">
                        <p class="fw-normal mb-1 small text-muted"><i class="bi bi-geo-alt me-1"></i>{{row.address || row.indirizzo}}</p>
                    </td>
                </ng-container>

                <ng-container matColumnDef="phone">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Phone </th>
                    <td mat-cell *matCellDef="let row"> <span class="small">{{row.phone || row.telefono}}</span> </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                
                <!-- No Data Row -->
                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell text-center py-5 text-muted" colspan="5">
                        <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                        No agencies found in the system.
                    </td>
                </tr>

            </table>
            <mat-paginator [pageSizeOptions]="[5, 10, 25]" aria-label="Select page of agencies" class="border-top"></mat-paginator>
        </div>
    </div>
</div>
